name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Stage _site/
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # Redirect + webapp
          cp index.html _site/
          cp -r webapp _site/webapp
          # Game content, fetched at runtime by the webapp via ../
          cp Baseline.md _site/
          [ -f Mechanics.md ] && cp Mechanics.md _site/ || true
          cp -r cards _site/cards

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
