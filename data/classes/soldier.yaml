# Soldier class. Format: see .claude/create-class.md → Class format.

name: Soldier
domains: [body, aid]
fantasy: "The protector. Stands between the others and the thing in the dark."
examples: [marine, security guard, cop, firefighter, bouncer]

features:
  main:
    name: Ward
    text:
      - "At the start of a scene, name one ally as your ward. While they're within Close range, you can mark your own Armor Slots to reduce damage they take."
  flair:
    name: Adrenaline
    text:
      - "When your Stress is maxed out, gain advantage on all Strength, Instinct and Agility rolls until the end of the scene or until your Stress is reduced. This overrides the usual max Stress penalties."
      - "While Adrenaline is active, the Stress ailment from maxing your Stress is suppressed. When the scene ends, Adrenaline stops: roll the Stress ailment and the normal max Stress penalties apply (the crash)."
  hope:
    name: Calm Under Pressure
    cost: 3
    text:
      - "Clear 2 Stress."

loop: "Adrenaline rewards maxed Stress, but Calm Under Pressure clears Stress and ends it. The player must choose between keeping the bonus and clearing Stress."
open:
  - "If Adrenaline ends early because your Stress is reduced (e.g. Calm Under Pressure), is the suppressed Stress ailment rolled then, at the end of the scene, or not at all?"
